services:
  okx-event-bot:
    build: .
    container_name: okx-event-bot
    restart: unless-stopped
    env_file: .env          # cp .env.example .env first — required even for mock_mode (values can stay empty)
    environment:
      - DASHBOARD_WEB_HOST=0.0.0.0   # 127.0.0.1 (config.yaml default) would be unreachable from outside the container
    ports:
      - "8000:8000"
    volumes:
      # Mounted, not baked into the image, so you can flip mock_mode / add
      # seriesId / tune strategies without rebuilding.
      - ./config.yaml:/app/config.yaml:ro
      # Persists bot.db (SQLite) and bot.log across restarts/rebuilds.
      #
      # Defaults to ./data (next to this compose file) — fine as long as
      # your redeploy re-runs `docker compose up --build` IN THE SAME
      # checkout directory. If your deploy instead does a fresh `git
      # clone`/checkout into a new directory each time (common on many
      # PaaS/CI setups), ./data there is empty (data/ is gitignored on
      # purpose) and history is silently lost on every redeploy.
      #
      # Fix: set BOT_DATA_DIR in .env to an ABSOLUTE path OUTSIDE any git
      # checkout, e.g. BOT_DATA_DIR=/var/lib/okx-event-bot-data — same
      # host path every deploy, survives a repo being re-cloned/rebuilt
      # from scratch. Leave unset to keep the ./data default.
      - ${BOT_DATA_DIR:-./data}:/app/data
